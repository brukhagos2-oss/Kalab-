name: Build Android APK Auto Fix
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Auto Create Missing Gradle Wrapper
      run: |
        # ወደ ዋናው ማውጫ ወይም አፕ ፎልደር ገብቶ ግራድልን ማደስ
        if [ -d "app" ]; then
          cd app
        fi
        gradle wrapper --gradle-version 8.2
        chmod +x gradlew

    - name: Build APK Directly
      run: |
        if [ -d "app" ]; then
          cd app && ./gradlew assembleDebug
        else
          ./gradlew assembleDebug
        fi

    - name: Upload Generated APK
      uses: actions/upload-artifact@v4
      with:
        name: Gold-Trading-Bot
        path: "**/build/outputs/apk/debug/*.apk"
