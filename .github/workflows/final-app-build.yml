name: Build Android APK Final Wrapper Fix
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Build APK with Auto Wrapper
      run: |
        if [ -d "app" ]; then
          cd app
        fi
        # የGradle ፋይሎችን በራሱ እንዲያድስ ማድረግ
        gradle wrapper
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload Generated APK
      uses: actions/upload-artifact@v4
      with:
        name: Gold-Trading-Bot
        path: "**/build/outputs/apk/debug/*.apk"

