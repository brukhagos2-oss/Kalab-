name: Build Android APK Final Fix
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Run Build Directly inside App Folder
      run: |
        if [ -f "app/gradlew" ]; then
          cd app && chmod +x gradlew && ./gradlew assembleDebug
        elif [ -f "gradlew" ]; then
          chmod +x gradlew && ./gradlew assembleDebug
        else
          # ፎልደሩን በራሱ ፈልጎ እንዲገባ ማድረግ
          GRADLE_DIR=$(find . -name gradlew -exec dirname {} \;)
          cd $GRADLE_DIR && chmod +x gradlew && ./gradlew assembleDebug
        fi

    - name: Upload Generated APK
      uses: actions/upload-artifact@v4
      with:
        name: Gold-Trading-Bot
        path: "**/build/outputs/apk/debug/*.apk"

